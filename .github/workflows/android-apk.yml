name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Build web assets
        run: ANDROID_APK=1 node scripts/build-pages.mjs
        env:
          ANDROID_APK: "1"

      - name: Copy into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a .output/public/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/meridian.apk
          ls -lh dist/meridian.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          name: Meridian ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          files: dist/meridian.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Offline Android build of **Meridian**.

            **Direct download:** [meridian.apk](https://github.com/wilsonsamiano/meridian-calculator/releases/latest/download/meridian.apk)

            1. Download the APK on your Android phone or tablet.
            2. Open it. Allow install from this source if Android asks.
            3. If you already had v1.0.0, install this over it.

            Web app: https://wilsonsamiano.github.io/meridian-calculator/

            Buy me a coffee: https://www.buymeacoffee.com/wilsonsamiano
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
