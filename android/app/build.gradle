plugins {
    id "com.android.application"
}

def keystoreFile = file("../release.keystore")

android {
    namespace "app.meridian.calc"
    compileSdk 35

    defaultConfig {
        applicationId "app.meridian.calc"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "meridian"
                keyAlias "meridian"
                keyPassword "meridian"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
